[package]
name = "wasixv2-vnet-wisp"
version = "0.0.0"
description = "WISP network backend for WASIX: guest traffic multiplexed over one WebSocket"
publish = false
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
wasixv2-abi = { path = "../abi" }
wasixv2-vnet = { path = "../vnet" }
thiserror.workspace = true

[dev-dependencies]
wasixv2-wait = { path = "../wait" }
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
wasixv2 = { path = "../api" }
wat.workspace = true
wasmer = { path = "../../api", version = "=7.5.0", default-features = false, features = [
  "cranelift",
] }
