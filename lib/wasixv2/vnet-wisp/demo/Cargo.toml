# Not a member of the wasmer workspace: it only builds for the browser.
[workspace]

[package]
name = "wasixv2-web-demo"
version = "0.0.0"
description = "A WASIX v2 guest in the browser, fetching over WISP"
publish = false
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasixv2 = { path = "../../api", default-features = false, features = ["js", "web"] }
wasixv2-vnet-wisp = { path = "..", features = ["web"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
wat = "1"
